name: NuGet publishing
on:
  workflow_call:
    inputs:
      stages: { type: string, default: 'checkout setup test pack integration archive publish release' }
      working-directory: { type: string, default: '.' }
      test-target: { type: string }
      integration-target: { type: string }
      pack-target: { type: string }
      version: { type: string }
      nuget-user: { type: string }
    secrets:
      NUGET_USER: { required: false }
concurrency: { group: 'nugetizer-${{ github.repository }}-${{ github.ref }}', cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: podnet-dev/pod-nugetizer@v2
        env: { NUGET_USER: '${{ inputs.nuget-user || secrets.NUGET_USER }}' }
        with:
          stages: ${{ inputs.stages }}
          working-directory: ${{ inputs.working-directory }}
          test-target: ${{ inputs.test-target }}
          integration-target: ${{ inputs.integration-target }}
          pack-target: ${{ inputs.pack-target }}
          version: ${{ inputs.version }}