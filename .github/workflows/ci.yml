name: CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Script tests
        shell: pwsh
        run: ./tests/Nugetizer.Tests.ps1
      - name: Composite fixture
        uses: ./
        with:
          stages: setup test pack integration
          working-directory: tests/fixtures
          test-target: tests/Fixture.Tests.csproj
          integration-target: tests/Fixture.IntegrationTests.csproj
          pack-target: src/Fixture/Fixture.csproj
          version: '10.0.0'