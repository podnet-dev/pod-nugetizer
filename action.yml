name: pod-nugetizer
description: Build, test and publish NuGet packages using Trusted Publishing.
inputs:
  stages: { description: 'Stages to run, in pipeline order.', default: 'checkout setup test pack integration archive publish release' }
  working-directory: { description: 'Consumer project root.', default: '.' }
  test-target: { description: 'Test project or solution.' }
  integration-target: { description: 'Package integration test project or solution.' }
  pack-target: { description: 'Distributable project or solution.' }
  version: { description: 'Release version; defaults to the tag.' }
  nuget-user: { description: 'NuGet policy creator; defaults to NUGET_USER.' }
outputs:
  directory: { description: 'Package staging directory.', value: '${{ steps.prepare.outputs.directory }}' }
runs:
  using: composite
  steps:
    - id: prepare
      shell: pwsh
      env:
        NG_INPUTS: ${{ toJSON(inputs) }}
        NG_USER: ${{ inputs.nuget-user || env.NUGET_USER }}
        NG_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        NG_SCRIPT: ${{ github.action_path }}/scripts/Nugetizer.ps1
      run: '& $env:NG_SCRIPT -Phase prepare'
    - if: ${{ steps.prepare.outputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: { persist-credentials: false }
    - if: ${{ steps.prepare.outputs.setup == 'true' }}
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with: { global-json-file: '${{ inputs.working-directory }}/global.json' }
    - name: Test, pack and integration
      shell: pwsh
      env:
        NG_INPUTS: ${{ toJSON(inputs) }}
        NG_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        NG_SCRIPT: ${{ github.action_path }}/scripts/Nugetizer.ps1
      run: '& $env:NG_SCRIPT -Phase build'
    - if: ${{ steps.prepare.outputs.archive == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ steps.prepare.outputs.directory }}/*.*nupkg
          ${{ steps.prepare.outputs.directory }}/manifest.json
        if-no-files-found: error
    - name: Release preflight
      if: ${{ steps.prepare.outputs.release == 'true' }}
      shell: pwsh
      env:
        NG_INPUTS: ${{ toJSON(inputs) }}
        NG_SCRIPT: ${{ github.action_path }}/scripts/Nugetizer.ps1
        GH_TOKEN: ${{ github.token }}
      run: '& $env:NG_SCRIPT -Phase preflight'
    - id: login
      if: ${{ steps.prepare.outputs.publish == 'true' }}
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with: { user: '${{ inputs.nuget-user || env.NUGET_USER }}' }
    - name: Publish
      if: ${{ steps.prepare.outputs.publish == 'true' }}
      shell: pwsh
      env:
        NG_INPUTS: ${{ toJSON(inputs) }}
        NG_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        NG_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        NG_SCRIPT: ${{ github.action_path }}/scripts/Nugetizer.ps1
      run: '& $env:NG_SCRIPT -Phase publish'
    - if: ${{ steps.prepare.outputs.release == 'true' }}
      name: GitHub release
      shell: pwsh
      env:
        NG_INPUTS: ${{ toJSON(inputs) }}
        NG_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        NG_SCRIPT: ${{ github.action_path }}/scripts/Nugetizer.ps1
        GH_TOKEN: ${{ github.token }}
      run: '& $env:NG_SCRIPT -Phase release'